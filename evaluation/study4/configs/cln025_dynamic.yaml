# Study 4: CLN025 dynamic (signal-driven freeze, GPU 7 pinned for ML)
simulation_input_dir: data/cln025
num_workers: 8
simulations_per_train: 6
simulations_per_inference: 1
num_total_simulations: 200
duration_sec: 3600

compute_settings:
  name: workstation
  available_accelerators: ["0", "1", "2", "3", "4", "5", "6", "7"]
  ml_accelerators: ["7"]
  worker_port_range: [50000, 55000]

simulation_settings:
  simulation_length_ns: 1
  report_interval_ps: 10
  temperature_kelvin: 300
  rmsd_reference_pdb: data/cln025/ref.pdb
  mda_selection: "protein and not name H*"
  cutoff_angstrom: 4.5

train_settings:
  cvae_settings_yaml: examples/cln025-folding-workstation/cvae-prod-settings.yaml

inference_settings:
  cvae_settings_yaml: examples/cln025-folding-workstation/cvae-prod-settings.yaml
  num_outliers: 100

policy_name: composite
policy_window_size: 5
policy_loss_threshold: 0.05
policy_min_improvement: 0.005
cooldown_sec: 30.0
signal_window_size: 20
redis_host: "127.0.0.1"
redis_port: 6379
