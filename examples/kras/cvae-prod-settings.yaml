# CVAE Model Hyperparameters for KRAS (167 CA residues from chain 1, resids 1-167)
# For documentation, see: https://mdlearn.readthedocs.io/en/latest/pages/_autosummary/mdlearn.nn.models.vae.symmetric_conv2d_vae.html#mdlearn.nn.models.vae.symmetric_conv2d_vae.SymmetricConv2dVAETrainer
input_shape: [1, 167, 167] # Contact matrix shape: one chain of the KRAS dimer (resids 1-167)
filters: [32, 32, 32, 32] # More filters than BBA for the more complex KRAS fold
kernels: [3, 3, 3, 3] # Standard 3x3 convolution kernels
strides: [1, 2, 2, 1] # Downsample in middle layers
affine_widths: [128] # Linear layer width
affine_dropouts: [0.0] # Dropout in linear layers
latent_dim: 12 # Higher dim to capture KRAS switch region dynamics
lambda_rec: 1.0 # Reconstruction vs KL divergence weight
num_data_workers: 4 # Parallel data loading workers
prefetch_factor: 2 # Batches to prefetch per worker
batch_size: 32 # Batch size for training
device: cuda # GPU training
optimizer_name: RMSprop # Optimizer
optimizer_hparams:
    lr: 0.001
    weight_decay: 0.00001
epochs: 100 # More epochs for the larger, more complex system
checkpoint_log_every: 100 # Log checkpoint at end of training
plot_log_every: 100 # Log latent space plot at end
plot_n_samples: 10000 # Samples for latent space visualization
plot_method: null # Set to "PCA" or "TSNE" for 12D latent space visualization
